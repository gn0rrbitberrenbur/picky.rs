# took from -> https://github.com/tauri-apps/tauri-action

name: 'Build and release'

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

  # This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build your app, and upload the artifacts to the release.

  jobs:
    publish-tauri:
      permissions:
        contents: write
      strategy:
        fail-fast: false
        matrix:
          include:
            - platform: 'ubuntu-22.04'
              args: ''
            - platform: 'windows-latest'
              args: ''

      runs-on: ${{ matrix.platform }}
      defaults:
        run:
          working-directory: picky
      steps:
        - uses: actions/checkout@v4

        - name: setup node
          uses: actions/setup-node@v4
          with:
            node-version: lts/*

        - name: install Rust stable
          uses: dtolnay/rust-toolchain@stable
          with:
            # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
            targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

        - name: install dependencies (ubuntu only)
          if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
          run: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

        - name: install frontend dependencies
          run: npm install # change this to npm, pnpm or bun depending on which one you use.

        - name: Build and release
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.ref_name || github.run_number) }}
          with:
            projectPath: picky
            tagName: ${{ env.RELEASE_TAG }}
            releaseName: ${{ env.RELEASE_TAG }}
            releaseDraft: false
            prerelease: false
            args: ${{ matrix.args }}

        - name: Rename bundled artifacts to picky_[version]_[platform]
          if: always()
          shell: bash
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.ref_name || github.run_number) }}
          run: |
            set -euo pipefail

            VERSION="${RELEASE_TAG#v}"
            PLATFORM="${{ matrix.platform }}"

            case "$PLATFORM" in
              ubuntu-22.04) PLATFORM_NAME="linux" ;;
              windows-latest) PLATFORM_NAME="windows" ;;
              *) PLATFORM_NAME="${PLATFORM//[^a-zA-Z0-9]/-}" ;;
            esac

            shopt -s nullglob
            BUNDLE_FILES=("$GITHUB_WORKSPACE"/picky/src-tauri/target/release/bundle/**/*)
            FOUND=""

            for file in "${BUNDLE_FILES[@]}"; do
              case "$file" in
                *.rpm|*.msi|*.deb|*.exe|*.appimage|*.AppImage)
                  FOUND="$file"
                  break
                  ;;
              esac
            done

            if [[ -z "$FOUND" ]]; then
              echo "No bundle artifact found for platform: $PLATFORM"
              exit 0
            fi

            EXT="${FOUND##*.}"
            TARGET_FILE="picky_${VERSION}_${PLATFORM_NAME}.${EXT}"
            cp "$FOUND" "$TARGET_FILE"

            gh release upload "$RELEASE_TAG" "$TARGET_FILE" --clobber